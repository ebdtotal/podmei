    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f4f6;
        color: #0f172a;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }
      #root:empty::before {
        content: "Carregando PODMEI…";
        display: block;
        padding: 2.5rem 1.5rem;
        color: #334155;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem("pod-mei-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
      window.addEventListener("error", function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        root.innerHTML =
          '<p style="padding:2.5rem 1.5rem;color:#334155">Não foi possível abrir o PODMEI. Atualize com Ctrl+F5 ou <a href="/">volte ao início</a>.</p>';
      });
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        root.innerHTML =
          '<p style="padding:2.5rem 1.5rem;color:#334155">O PODMEI não carregou. Atualize com Ctrl+F5 ou <a href="/entrar">entre por aqui</a>.</p>';
      }, 8000);
    </script>
